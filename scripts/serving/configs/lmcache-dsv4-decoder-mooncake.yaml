# HCCL PD (LMCache-Ascend) + Mooncake L2 store — decoder / kv_consumer.
# Placeholders are filled by pd_mooncake_decoder_node.sh from DECODE_HOST /
# MOONCAKE_HOST (do not commit machine IPs).
chunk_size: 1024
use_layerwise: False
numa_mode: "auto"

local_cpu: True
max_local_cpu_size: 5

remote_url: "mooncakestore://__MOONCAKE_HOST__:50051/"
remote_serde: "naive"

extra_config:
  save_only_first_rank: true
  save_chunk_meta: false
  local_hostname: "__DECODE_HOST__"
  metadata_server: "http://__MOONCAKE_HOST__:8080/metadata"
  protocol: "tcp"
  master_server_address: "__MOONCAKE_HOST__:50051"
  global_segment_size: 13958643712
  local_buffer_size: 5368709120
  transfer_timeout: 1

enable_pd: True
transfer_channel: "hccl"
pd_role: "receiver"
pd_peer_host: "__DECODE_HOST__"
pd_pull_mode: False
pd_delay_pull: False
pd_peer_init_port: [7300, 7301, 7302, 7303, 7304, 7305, 7306, 7307]
pd_peer_alloc_port: [7400, 7401, 7402, 7403, 7404, 7405, 7406, 7407]
pd_buffer_size: 1073741824
pd_buffer_device: "npu"
save_unfull_chunk: True
